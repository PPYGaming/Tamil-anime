name: Update Anime Catalog

"on":
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run updater
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CONTENT_REGION: IN
          UPDATE_CRON: '0 */6 * * *'
          YOUTUBE_MAX_RESULTS: '10'
        run: node scripts/update-anime.js
      - name: Commit changes
        run: |
          if git diff --quiet -- data/anime.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime.json
          git commit -m "Auto update anime catalog"
          git push
