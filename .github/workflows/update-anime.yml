name: Update Anime Catalog

"on":
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_rescan:
        description: 'Restart the YouTube channel history scan from the beginning (owner recovery only; normally leave off)'
        type: boolean
        default: false

permissions:
  contents: write

# One catalog update at a time. A run that is requested while another is running waits behind it (the running one is
# never cancelled mid-write), and GitHub keeps at most one waiting run, so several clicks collapse into one follow-up.
concurrency:
  group: update-anime-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test catalog pipeline
        run: node --test
      - name: AniDub India first scan (owner-trusted Tamil directory)
        run: node scripts/fetch-anidub.js
        continue-on-error: true
      - name: Run updater
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CONTENT_REGION: IN
          UPDATE_CRON: '0 */6 * * *'
          YOUTUBE_MAX_RESULTS: '10'
          # Automatic discovery from the allow-listed official channel (see README). Needs YOUTUBE_API_KEY; without it
          # the scan report says "missing-youtube-key" and only the manifest is processed.
          DISCOVERY_ENABLED: 'true'
          DISCOVERY_FULL_RESCAN: ${{ inputs.full_rescan == true && 'true' || 'false' }}
        run: |
          node scripts/update-anime.js
          node scripts/attach-anidub.js || true
          # Playlist links are an extra: if this step fails, the catalog written above is still valid and is committed.
          node scripts/attach-playlists.js || true
      - name: Free-site listings (read-only, never blocks the run)
        run: |
          node scripts/free-site-listings.js || true
          node scripts/free-season-evidence.js || true
          node scripts/attach-free-sites.js || true
        continue-on-error: true
      - name: Tavily discovery (leads only)
        run: node scripts/discover-tavily.js
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        continue-on-error: true
      - name: Third-party fallback and cross-availability
        run: |
          node scripts/add-reported.js || true
          node scripts/attach-free-sites.js || true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        continue-on-error: true
      - name: Validate generated catalog and UI before publishing
        run: node --test
      - name: Commit changes
        run: |
          set -euo pipefail
          # The checkpoint file is new on the first run, so stage first and test the staged diff (git diff alone ignores untracked files).
          git add -A -- data/anime.json data/discovery-state.json data/youtube-playlists.json data/discovery-leads.json
          if [ -f data/anidub-snapshot.json ]; then git add -A -- data/anidub-snapshot.json; fi
          if [ -f data/free-season-evidence.json ]; then git add -A -- data/free-season-evidence.json; fi
          if [ -f data/fallback-state.json ]; then git add -A -- data/fallback-state.json; fi
          # auto-reported.json exists only after the first promoted lead; git add fails on a missing path.
          if [ -f data/auto-reported.json ]; then git add -A -- data/auto-reported.json; fi
          if [ -f data/free-site-listings.json ]; then git add -A -- data/free-site-listings.json; fi
          if [ -f data/free-site-leads.json ]; then git add -A -- data/free-site-leads.json; fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update anime catalog"
          git push
